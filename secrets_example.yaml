# Copy this file to `secrets.yaml` (git-ignored) and set machine-local values.
#   Never commit `secrets.yaml` or copy its values into issues, logs or code.
# `Data` is the data root used instead of `data_storage_path` in config.yml,
#   for example a drive holding large inputs and target stores. Delete the
#   line to use the repository's `Data/` folder.
Data: "D:/Path/To/VegVault_data"
# The database the build writes; read by resolve_database_path()
database_path: "D:/Path/To/VegVault.sqlite"
# The released v1.0.0 database, opened read-only for comparisons;
#   read by resolve_database_path(key = "database_v1_path"). Until the
#   website and the legacy scripts move to the new setup, it is also their
#   database (`path_to_vegvault` of R/00_Config_file.R). It replaces the
#   former .secrets/path.yaml.
database_v1_path: "D:/Path/To/VegVault_v1.0.0.sqlite"
