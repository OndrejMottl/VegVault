# Producer artefact contract. Format: Data/Contracts/README.md
contract_id: try_traits
contract_version: 1.0.0
status: active
title: TRY plant traits under the unit contract
description: >-
  One row per published TRY trait record, already converted to the canonical
  unit of its trait by the producer's unit contract. VegVault turns every
  observation into one sample (age 0) and every record into one trait value.
producer:
  repository: OndrejMottl/VegVault-Trait_data
  directory: Outputs/Data
consumers:
  - R/02_Main_analyses/04_Import_try_data.R
  - R/Functions/Traits/load_local_trait_artifacts.R
  - R/Functions/Traits/validate_trait_import.R
  - R/Functions/Traits/add_trait_domain.R
file:
  name_templates:
    - 'data_trait_try_{date}__{hash}__.qs'
  evidence: >-
    R/01_Data_download/01_TRY.R in the producer (branch OndrejMottl/issue76)
    saves data_trait_processed with file_name = "data_trait_try". No artefact
    under this contract exists yet: the local file
    data_trait_try_2024-09-02__63e33ce9c3693fbafa182e2e340629cf__.qs (tag
    v1.1.0) predates the unit contract and lacks its columns. Every entry
    below is therefore taken from code; line numbers of VegVault files refer
    to the branch of pull request 81.
partitioning:
  scheme: none
extra_columns: allow
columns:
  - name: source_provider
    class: character
    nullable: false
    description: Provider of the record.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:49 in the producer coerces it to character.
    checks:
      allowed_values: [TRY]
  - name: source_dataset_key
    class: character
    nullable: true
    description: Provider dataset identifier, when the record has one.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:50,62-67 allows it to be missing.
  - name: source_record_id
    class: character
    nullable: false
    description: Provider record identifier.
    evidence: >-
      load_local_trait_artifacts.R:47-54 and validate_trait_import.R:2-8
      require it; apply_trait_unit_contract.R:51.
    checks:
      not_empty: true
  - name: source_trait_id
    class: character
    nullable: false
    description: Provider trait identifier.
    evidence: >-
      load_local_trait_artifacts.R:47-54 and validate_trait_import.R:2-8
      require it; apply_trait_unit_contract.R:52.
    checks:
      not_empty: true
  - name: original_value_string
    class: character
    nullable: false
    description: Value as written by the provider, before parsing.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:53,142 in the producer marks records whose
      value cannot be parsed as failed, so published records have one.
    checks:
      not_empty: true
  - name: original_unit
    class: character
    nullable: false
    description: Unit as written by the provider.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:143-144 in the producer marks records with a
      missing or blank unit as ambiguous, so published records have one.
    checks:
      not_empty: true
  - name: normalized_original_unit
    class: character
    nullable: false
    description: >-
      Provider unit after alias normalisation; the key into the conversion
      registry.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:145 in the producer marks records without it
      as unsupported, so published records always have one.
    checks:
      not_empty: true
  - name: conversion_rule_key
    class: character
    nullable: false
    description: Key of the unit-conversion rule applied to the record.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it; validate_trait_import.R
      :13-18 aborts on a missing rule key, but not on an empty one, which
      would only fail later as an unresolved rule.
    checks:
      not_empty: true
  - name: conversion_status
    class: character
    nullable: false
    description: Outcome of the unit conversion.
    evidence: >-
      apply_trait_unit_contract.R:141-153,196-210 in the producer publishes
      only records whose status is identity or converted.
    checks:
      allowed_values: [identity, converted]
  - name: disposition
    class: character
    nullable: false
    description: Publication decision of the unit contract.
    evidence: >-
      load_local_trait_artifacts.R:65 aborts unless every row is published;
      01_TRY.R in the producer filters disposition == "published".
    checks:
      allowed_values: [published]
  - name: derivation_rule_key
    class: character
    nullable: true
    description: >-
      Key of the derivation rule when the value was derived from other
      traits; missing otherwise.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:176 treats missing as no derivation.
  - name: trait_value
    class: numeric
    nullable: false
    description: Trait value in trait_unit.
    evidence: >-
      validate_trait_import.R:13-18 aborts on non-finite values.
    checks:
      finite: true
  - name: trait_unit
    class: character
    nullable: false
    description: Canonical unit of trait_full_name and of its trait_domain.
    evidence: >-
      validate_trait_import.R:13-18 aborts on a missing unit, and lines 21-28
      on a trait with more than one unit; add_trait_domain.R:9-18 aborts on a
      trait domain with more than one unit.
    checks:
      not_empty: true
  - name: observation_id
    class: numeric
    nullable: false
    description: >-
      TRY observation identifier; becomes the sample name try_<id>.
    evidence: >-
      04_Import_try_data.R:130; v1.1.0 file: integer, no missing values.
    checks:
      whole_number: true
  - name: dataset
    class: character
    nullable: false
    description: TRY dataset name; stored as the data source description.
    evidence: >-
      04_Import_try_data.R:65; v1.1.0 file: character, no missing values.
    checks:
      not_empty: true
  - name: reference_source
    class: character
    nullable: true
    description: Reference of the dataset; stored as the data source reference.
    evidence: >-
      04_Import_try_data.R:68; v1.1.0 file: character, 738780 missing of
      1205168.
  - name: dataset_reference_citation
    class: character
    nullable: true
    description: Citation of the record; stored as the sample reference.
    evidence: >-
      04_Import_try_data.R:69; not in the v1.1.0 file, so it is new in the
      unit-contract export.
  - name: longitude
    class: numeric
    nullable: true
    unit: decimal degree (WGS84)
    description: Observation longitude, when known.
    evidence: >-
      04_Import_try_data.R:66 coerces with as.numeric(); the v1.1.0 file
      stores it as character (350844 missing of 1205168). The contract
      requires numeric so that unparsable text is caught by the producer
      instead of becoming a silent NA in the import.
    checks:
      finite: true
      range:
        min: -180
        max: 180
  - name: latitude
    class: numeric
    nullable: true
    unit: decimal degree (WGS84)
    description: Observation latitude, when known.
    evidence: >-
      04_Import_try_data.R:67 coerces with as.numeric(); character in the
      v1.1.0 file (349379 missing).
    checks:
      finite: true
      range:
        min: -90
        max: 90
  - name: acc_species_name
    class: character
    nullable: false
    description: Accepted species name; stored as the taxon name.
    evidence: >-
      04_Import_try_data.R:176,220; v1.1.0 file: character, no missing values.
    checks:
      not_empty: true
  - name: trait_domain
    class: character
    nullable: false
    description: VegVault trait domain.
    evidence: >-
      04_Import_try_data.R:194; v1.1.0 file: 6 domains, no missing values.
      The v1.1.0 file spells one domain "Plant heigh".
    checks:
      not_empty: true
  - name: trait_full_name
    class: character
    nullable: false
    description: Trait name; stored as the trait name.
    evidence: >-
      04_Import_try_data.R:219; v1.1.0 file: 10 distinct, no missing values.
    checks:
      not_empty: true
keys:
  - [observation_id, trait_full_name, acc_species_name]
dependencies:
  - determinant: [trait_full_name]
    dependent: [trait_unit]
  - determinant: [trait_domain]
    dependent: [trait_unit]
  - determinant: [observation_id]
    dependent:
      - dataset
      - longitude
      - latitude
      - reference_source
      - dataset_reference_citation
notes:
  - >-
    TRY is kept as a source (decision of 2026-11-19 in
    OndrejMottl/VegVault-Trait_data issue 13): values are rebuilt from TRY's
    standardised values under the unit contract, from the existing data
    request, and duplicated measurements are removed by the producer (rule
    designed in VegVault-Trait_data issue 14).
  - >-
    The key is what the import needs: validate_trait_import.R:30-40 aborts
    unless (dataset_name, sample_name, trait_name, taxon_name) is unique, and
    sample_name is try_<observation_id>. Whether the producer's own record
    key (source_provider, source_record_id) is unique too is asked of the
    trait lane.
  - >-
    The import builds one dataset per combination of dataset, coordinates
    and references and one sample per observation, so an observation must
    have one dataset, one location and one set of references (the last
    dependency); otherwise one sample would belong to two datasets.
  - >-
    Every conversion_rule_key and derivation_rule_key must exist in the rule
    registry. The trait import of pull request 81 reads the registry from
    the producer's config/trait_units/ in the sibling checkout
    (add_trait_rules.R), so the producer's registry is authoritative; the pin
    manifest pins it and the import stage checks the keys.
