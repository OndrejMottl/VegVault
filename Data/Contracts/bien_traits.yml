# Producer artefact contract. Format: Data/Contracts/README.md
contract_id: bien_traits
contract_version: 1.0.0
status: active
title: BIEN plant traits under the unit contract
description: >-
  One row per published BIEN trait measurement, already converted to the
  canonical unit of its trait by the producer's unit contract, split into
  numbered parts. VegVault turns every measurement into one sample (age 0)
  and one trait value.
producer:
  repository: OndrejMottl/VegVault-Trait_data
  directory: Outputs/Data
consumers:
  - R/02_Main_analyses/05_Import_bien_trait_data.R
  - R/Functions/Traits/load_local_trait_artifacts.R
  - R/Functions/Traits/validate_trait_import.R
  - R/Functions/Traits/add_trait_domain.R
file:
  name_templates:
    - 'data_traits_bien_{partition}_{date}__{hash}__.qs'
  evidence: >-
    R/02_Process_data/01_BIEN_process.R in the producer (branch
    OndrejMottl/issue76) splits the published rows into 4 parts by row order
    and saves them as data_traits_bien_<part - 1>. No artefact under this
    contract exists yet: the local files data_traits_bien_0..3_2025-08-02
    predate the unit contract (they hold trait_name and unit, not the
    contract columns). Entries below are taken from code unless a local
    value is quoted; line numbers of VegVault files refer to the branch of
    pull request 81.
partitioning:
  scheme: integer
  first: 0
  contiguous: true
  evidence: >-
    01_BIEN_process.R numbers the parts from 0 (as.integer(.y) - 1L); the
    v1.0.0 files and the local files are numbered 0 to 3. The import used to
    keep the newest file per part by modification time
    (load_local_trait_artifacts.R); the pin manifest replaces that with an
    explicit list of files, which this contract checks for gaps and
    duplicates. The number of parts is not fixed by the contract.
extra_columns: allow
columns:
  - name: source_provider
    class: character
    nullable: false
    description: Provider of the record.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:49 in the producer coerces it to character.
    checks:
      allowed_values: [BIEN]
  - name: source_dataset_key
    class: character
    nullable: true
    description: Provider dataset identifier, when the record has one.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:50,62-67 allows it to be missing.
  - name: source_record_id
    class: character
    nullable: false
    description: Provider record identifier.
    evidence: >-
      load_local_trait_artifacts.R:47-54 and validate_trait_import.R:2-8
      require it; apply_trait_unit_contract.R:51.
    checks:
      not_empty: true
  - name: source_trait_id
    class: character
    nullable: false
    description: Provider trait identifier.
    evidence: >-
      load_local_trait_artifacts.R:47-54 and validate_trait_import.R:2-8
      require it; apply_trait_unit_contract.R:52.
    checks:
      not_empty: true
  - name: original_value_string
    class: character
    nullable: false
    description: Value as written by the provider, before parsing.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:53,142 in the producer marks records whose
      value cannot be parsed as failed, so published records have one.
    checks:
      not_empty: true
  - name: original_unit
    class: character
    nullable: false
    description: Unit as written by the provider.
    evidence: >-
      load_local_trait_artifacts.R:47-54 requires it;
      apply_trait_unit_contract.R:143-144 in the producer marks records with a
      missing or blank unit as ambiguous, so published records have one.
    checks:
      not_empty: true
  - name: normalized_original_unit
    class: character
    nullable: false
    description: >-
      Provider unit after alias normalisation; the key into the conversion
      registry.
    evidence: >-
      apply_trait_unit_contract.R:145 in the producer marks records without it
      as unsupported, so published records always have one.
    checks:
      not_empty: true
  - name: conversion_rule_key
    class: character
    nullable: false
    description: Key of the unit-conversion rule applied to the record.
    evidence: >-
      validate_trait_import.R:13-18 aborts on a missing rule key, but not on
      an empty one, which would only fail later as an unresolved rule.
    checks:
      not_empty: true
  - name: conversion_status
    class: character
    nullable: false
    description: Outcome of the unit conversion.
    evidence: >-
      apply_trait_unit_contract.R:141-153,196-210 publishes only records
      whose status is identity or converted.
    checks:
      allowed_values: [identity, converted]
  - name: disposition
    class: character
    nullable: false
    description: Publication decision of the unit contract.
    evidence: >-
      load_local_trait_artifacts.R:65 aborts unless every row is published;
      01_BIEN_process.R filters disposition == "published".
    checks:
      allowed_values: [published]
  - name: derivation_rule_key
    class: character
    nullable: true
    description: >-
      Key of the derivation rule when the value was derived from other
      traits; missing otherwise.
    evidence: load_local_trait_artifacts.R:47-54 requires it.
  - name: trait_value
    class: numeric
    nullable: false
    description: Trait value in trait_unit.
    evidence: validate_trait_import.R:13-18 aborts on non-finite values.
    checks:
      finite: true
  - name: trait_unit
    class: character
    nullable: false
    description: Canonical unit of trait_full_name and of its trait_domain.
    evidence: >-
      validate_trait_import.R:13-18 and 21-28 abort on a missing unit or on a
      trait with more than one unit; add_trait_domain.R:9-18 aborts on a
      trait domain with more than one unit.
    checks:
      not_empty: true
  - name: id
    class: character
    nullable: false
    description: >-
      BIEN measurement identifier; becomes the sample name bien_traits_<id>,
      so it must be unique over all parts.
    evidence: >-
      05_Import_bien_trait_data.R:145; local 2025-08-02 parts: character,
      unique within each part.
    checks:
      not_empty: true
  - name: project_pi
    class: character
    nullable: true
    description: Principal investigator; stored as the data source description.
    evidence: >-
      05_Import_bien_trait_data.R:80; local 2025-08-02 parts: 1207 and 874
      missing.
  - name: source_citation
    class: character
    nullable: true
    description: Citation; stored as the data source reference.
    evidence: 05_Import_bien_trait_data.R:83.
  - name: longitude
    class: numeric
    nullable: true
    unit: decimal degree (WGS84)
    description: Measurement longitude, when known.
    evidence: >-
      05_Import_bien_trait_data.R:81 coerces with as.numeric(); local
      2025-08-02 parts: double, partly missing.
    checks:
      finite: true
      range:
        min: -180
        max: 180
  - name: latitude
    class: numeric
    nullable: true
    unit: decimal degree (WGS84)
    description: Measurement latitude, when known.
    evidence: >-
      05_Import_bien_trait_data.R:82 coerces with as.numeric(); local
      2025-08-02 parts: double, partly missing.
    checks:
      finite: true
      range:
        min: -90
        max: 90
  - name: scrubbed_species_binomial
    class: character
    nullable: false
    description: Scrubbed species name; stored as the taxon name.
    evidence: >-
      05_Import_bien_trait_data.R:194; the local 2025-08-02 parts have
      missing values (26368 in part 0) before the unit contract is applied.
      Missing names are not allowed because the record cannot be attached to
      a taxon; confirm with the trait lane that they are removed.
    checks:
      not_empty: true
  - name: trait_domain
    class: character
    nullable: false
    description: VegVault trait domain.
    evidence: 05_Import_bien_trait_data.R:212.
    checks:
      not_empty: true
  - name: trait_full_name
    class: character
    nullable: false
    description: Trait name; stored as the trait name.
    evidence: 05_Import_bien_trait_data.R:234.
    checks:
      not_empty: true
keys:
  - [id]
dependencies:
  - determinant: [trait_full_name]
    dependent: [trait_unit]
  - determinant: [trait_domain]
    dependent: [trait_unit]
notes:
  - >-
    Every conversion_rule_key and derivation_rule_key must exist in the rule
    registry. The trait import of pull request 81 reads the registry from
    the producer's config/trait_units/ in the sibling checkout
    (add_trait_rules.R), so the producer's registry is authoritative; the pin
    manifest pins it and the import stage checks the keys.
