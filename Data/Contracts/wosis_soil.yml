# Producer artefact contract. Format: Data/Contracts/README.md
contract_id: wosis_soil
contract_version: 1.0.0
status: active
title: Soil classes on the gridpoint raster
description: >-
  One row per grid cell with a soil-class code. VegVault attaches each value
  at age 0 to the gridpoint sample of the same rounded coordinates, if that
  sample exists.
producer:
  repository: OndrejMottl/VegVault-abiotic_data
  directory: Outputs/Data/WoSIS
consumers:
  - R/02_Main_analyses/09_Import_wosis_soil_data.R
  - R/02_Main_analyses/06_Create_gridpoints.R
file:
  name_templates:
    - 'wosis_data_{date}__{hash}__.qs'
  evidence: >-
    R/02_Main_analyses/05_Extract_and_save_wosis.R in the producer; v1 file
    wosis_data_2024-08-06__e8fb256f5b70deb9576ea69806c59eb1__.qs (tag v1.1.0),
    266429 rows.
partitioning:
  scheme: none
extra_columns: error
columns:
  - name: long
    class: numeric
    nullable: false
    unit: decimal degree (WGS84)
    description: Grid-cell centre longitude.
    evidence: >-
      09_Import_wosis_soil_data.R:66; v1: double, -179.90 to 179.90.
    checks:
      finite: true
      range:
        min: -180
        max: 180
  - name: lat
    class: numeric
    nullable: false
    unit: decimal degree (WGS84)
    description: Grid-cell centre latitude.
    evidence: >-
      09_Import_wosis_soil_data.R:67; v1: double, -55.06 to 83.48.
    checks:
      finite: true
      range:
        min: -90
        max: 90
  - name: value
    class: numeric
    nullable: false
    unit: Unitless
    description: >-
      Soil-class code. The unit equals the string hard-coded in
      09_Import_wosis_soil_data.R:100.
    evidence: >-
      09_Import_wosis_soil_data.R:100,117 (detail "SoilGrids-soil_class");
      v1: double, whole numbers 1 to 34, 30 distinct.
    checks:
      whole_number: true
      range:
        min: 1
        max: 34
  - name: var_name
    class: character
    nullable: false
    description: >-
      Variable name, stored as the abiotic variable name in the database.
    evidence: >-
      09_Import_wosis_soil_data.R:99; v1: one value, "HWSD2".
    checks:
      not_empty: true
keys:
  - [long, lat]
rounded_keys:
  - columns: [long, lat]
    digits: 2
notes:
  - >-
    The source is unresolved: the v1 file is labelled HWSD2 (the producer
    downloads the Harmonized World Soil Database v2), the import describes it
    as SoilGrids-soil_class and cites WoSIS. The source is settled in
    VegVault issue 82; the contract id and the allowed codes follow that
    decision.
  - >-
    The code range 1 to 34 is taken from v1; a source change will change it.
