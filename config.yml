# Project configuration read through `load_config_value()`.
# Select a profile with the `R_CONFIG_ACTIVE` environment variable; the
#   `default` profile is used otherwise. Other profiles inherit from
#   `default` and only list the values they change.
# Machine-local paths, including the live and v1 database paths, do not
#   belong here; put them in the git-ignored `secrets.yaml` (see
#   `secrets_example.yaml`). The one exception is the disposable database of
#   the `subset` profile, a path relative to the data root.
# Profiles: `default` (full build during development), `subset` (regional
#   rehearsal build) and `release` (the published build).
# Each pipeline stage has an owner (see .ai/analysis-structure.md); add or
#   change only the sections of the stages you own.

default:
  # Name of the active profile, recorded in the build manifest
  profile: "default"
  seed: 900723
  # Data root used when `secrets.yaml` has no `Data` entry; relative to the
  #   project. Target stores go to `<data root>/Targets_data/`.
  data_storage_path: "Data"
  # Packages for renv to record. Packages called only as `pkg::fun()` are
  #   detected automatically.
  packages:
    # Attached by `R/___setup_project___.R`. The legacy database writers
    #   call `%>%` and some functions without a namespace, so the packages
    #   R/00_Config_file.R attached for them stay attached. Do not attach
    #   packages that mask base functions (e.g. renv, config).
    attach:
      - assertthat
      - cli
      - DBI
      - here
      - RSQLite
      - targets
      - tidyverse
    # Installed and recorded, but not attached (IDE and workflow tools, and
    #   packages used only through others, such as `maps` for the country
    #   outlines of ggplot2::map_data())
    tools:
      - janitor
      - jsonlite
      - knitr
      - languageserver
      - maps
      - remotes
      - rlang
      - roxygen2
      - tinytable
      - usethis
  # Figure defaults of the template, used by the project setup
  graphical:
    width: 16
    height: 12
    units: "cm"
    dpi: 300
    bg: "white"
    text_size: 10
    line_size: 0.1
    # Manuscript figures, from R/03_Visualisation/01_manuscript/
    #   00_Config_mns.R. Palette colours stay in `colors.json`; the three
    #   colours below are the ones that script sets directly.
    manuscript:
      text_size: 14
      line_size: 0.1
      point_size: 3
      # Text width, in characters, at which labels are wrapped
      text_wrap_width: 60
      image_units: "mm"
      image_width:
        single: 89
        double: 183
        full: 247
      colors:
        brown_neutral: "#5F634F"
        grey: "#999999"
        red: "red"
    # Website figures, from R/03_Visualisation/00_Config_quarto.R. Colours
    #   and the font stay in `colors.json` and `fonts.json`.
    website:
      text_size: 32
      line_size: 0.1
      point_size: 3
      image_units: "px"
      image_width: 2450
      image_height: 1200
  # Database version record; the last entry is the version being built.
  #   R/00_Config_file.R reads it for the website and the legacy scripts.
  database:
    versions:
      - version: "0.0.2"
        update_date: "2024-10-17"
        changelog: "Beging the versioning of the database"
      - version: "0.0.3"
        update_date: "2024-11-18"
        changelog: "Reworked the `References` and flagged `mandatory`"
      - version: "0.0.4"
        update_date: "2024-12-19"
        changelog: >-
          Update the version control and correct the Dataset References
      - version: "1.0.0"
        update_date: "2025-01-20"
        changelog: "First release of the database"
      - version: "2.0.0"
        update_date: "2026-08-28"
        changelog: >-
          Development schema for audited trait units and transformation
          provenance; not a published database release

  #--------------------------------------------------#
  # Sections of the VegVault pipeline stages: producer import, validation,
  #   export and figures. `graphical: manuscript` above holds the figure
  #   sizes and colours.
  #--------------------------------------------------#

  # Pinned producer artefacts (Data/Producers/producer_manifest.yml)
  producers:
    # The pin manifest, relative to the project root
    manifest: "Data/Producers/producer_manifest.yml"
    # `dev` reads the explicit local files of the manifest from the sibling
    #   producer checkouts and never downloads; `release` fetches the tagged
    #   files and checks their checksums (set by the release profile)
    mode: "dev"
    # Folder holding the sibling producer checkouts, relative to the
    #   project root
    dev_root: ".."
    # Download cache of the release files, relative to the data root
    cache_dir: "Producers"
    # Release files are fetched from the raw GitHub file at the tag
    release_url_template: "https://raw.githubusercontent.com/{repository}/{tag}/{directory}/{file_name}"
    # How the `subset` profile cuts each artefact to its box: by the
    #   coordinate columns, widened by the subset margins (`flag_margin`)
    #   for the climate and soil grids around the box, or by the keys kept
    #   in another artefact. Rows without coordinates are dropped, including
    #   trait records without a location. Every artefact needs an entry.
    subset_filter:
      splot_plots:
        col_lon: "longitude"
        col_lat: "latitude"
        flag_margin: false
      bien_plots:
        col_lon: "longitude"
        col_lat: "latitude"
        flag_margin: false
      fossilpol_assembly:
        col_lon: "long"
        col_lat: "lat"
        flag_margin: false
      # Age uncertainty has no coordinates: keep the datasets of the
      #   filtered assembly
      fossilpol_age_uncertainty:
        col_key: "dataset_id"
        reference: "fossilpol_assembly"
      try_traits:
        col_lon: "longitude"
        col_lat: "latitude"
        flag_margin: false
      bien_traits:
        col_lon: "longitude"
        col_lat: "latitude"
        flag_margin: false
      chelsa_neoclimate:
        col_lon: "long"
        col_lat: "lat"
        flag_margin: true
      chelsa_trace21k_palaeoclimate:
        col_lon: "long"
        col_lat: "lat"
        flag_margin: true
      hwsd_soil:
        col_lon: "long"
        col_lat: "lat"
        flag_margin: true
      # The trait unit rules have no place: every rule is kept
      trait_unit_conversions:
        flag_keep_all: true
      trait_derivations:
        flag_keep_all: true
  # Regional rehearsal build; enabled only in the `subset` profile below
  subset:
    enabled: false
  # Release checks of the built database (R/Analyses/04_Validation/)
  validation:
    # Run SQLite's quick_check instead of the full integrity_check. For
    #   development only: a build checked this way is not eligible for
    #   release
    quick_check: false
    # Folder of the validation report, relative to the project root
    output_dir: "Outputs/Tables"
    # Abiotic values. The ranges, forbidden and allowed values come from
    #   the producer contracts in Data/Contracts/; these settings cover
    #   what the contracts do not.
    abiotic_values:
      # Storage caps of a source, kept as lower bounds: values at a cap are
      #   flagged by share, not failed. CHELSA V2.1 stores bio12 as
      #   unsigned 16-bit integers scaled by 0.1 (decided 2026-11-21)
      capped_values:
        chelsa_neoclimate:
          bio12: 6553.5
      # A latitude band (1 degree) with fewer values is not evaluated
      min_values_per_band: 30
      # Zero-share thresholds by artefact, rule and variable: `max` (share
      #   of values exactly 0), `step` (change from the band to the north)
      #   and `age_deviation` (share minus the median of the other ages).
      #   Copied from the raster quality check of VegVault-abiotic_data
      #   (config.yml, quality_checks: thresholds, commit 19de9d1, issue
      #   16), derived on raster cells on 2026-11-21; gridpoints sample the
      #   rasters unevenly, so a result is a flag for review
      zero_share:
        chelsa_neoclimate:
          max: {bio1: 0.05, bio4: 0.05, bio6: 0.05, bio12: 0.05,
            bio15: 0.05, bio18: 0.131, bio19: 0.140}
          step: {bio1: 0.05, bio4: 0.05, bio6: 0.05, bio12: 0.05,
            bio15: 0.05, bio18: 0.076, bio19: 0.096}
        chelsa_trace21k_palaeoclimate:
          max: {bio1: 0.051, bio4: 0.05, bio6: 0.05, bio12: 0.115,
            bio15: 0.093, bio18: 0.318, bio19: 0.313}
          step: {bio1: 0.051, bio4: 0.05, bio6: 0.05, bio12: 0.101,
            bio15: 0.085, bio18: 0.141, bio19: 0.153}
          age_deviation: {bio1: 0.05, bio4: 0.05, bio6: 0.05,
            bio12: 0.314, bio15: 0.095, bio18: 0.35, bio19: 0.277}
      # Accepted exceptions of the same check (allow-list, accepted by
      #   Ondrej Mottl on 2026-11-21); a band within the latitude limits
      #   is not flagged by the listed rules
      zero_share_exceptions:
        - artefact_id: chelsa_trace21k_palaeoclimate
          variables: [bio12, bio18, bio19]
          rules: [max, step]
          lat_min: -91
          lat_max: -74
          reason: "Antarctic interior: CHELSA-TraCE21k has no downscaled
            precipitation south of 74 S, so zero shares up to 1 occur in
            every age."
    # Links between positions and gridpoints, checked against the rule of
    #   the `link` section on a stratified random sample of positions
    #   (near the dateline, at high latitudes, elsewhere), drawn with
    #   `seed`
    links:
      # Positions drawn per stratum; a smaller stratum is checked whole
      n_positions_per_stratum: 200
    # Comparison with v1.0.0: rows per table, datasets, samples,
    #   positions, taxon links and trait values per source, and abiotic
    #   values per variable, against the committed reference table (built
    #   by R/Validation/build_v1_reference_counts.R; the stage never opens
    #   v1.0.0). A change of more than `tolerance` in either direction, or
    #   a count in one version only, is flagged for review, never failed
    #   (decided by Ondrej Mottl on 2026-11-21). Subset builds are not
    #   compared
    v1_comparison:
      reference: "Data/Validation/v1.0.0_reference_counts.csv"
      tolerance: 0.05
      # v1.0.0 counts that 2.0.0 counts differently
      metric_map:
        - v1_metric: table_rows
          v1_scope: AbioticDataReference
          metric: sample_links
          scope: all
          note: "A view over the position tables in 2.0.0 (G2 decision
            1), counted as links per position times samples per position."
      # Changes that decisions of the release expect; the reason is added
      #   to the flag, which stays for review
      expected_changes:
        - metrics: [table_rows]
          scopes: [BuildProducers, Positions, SamplePosition, PositionLink,
            TraitUnitConversion, TraitDerivation]
          reason: "New table of the 2.0.0 schema (VegVault issue 88)."
        - metrics: [sample_links]
          scopes: [all]
          reason: "Links near the dateline and at high latitudes, which
            v1.0.0 missed, are added (VegVault pull request 120)."
        - metrics: [datasets, samples, positions, traits_value_rows]
          scopes: ["traits / TRY"]
          reason: "TRY values from StdValue of request 28498, with
            duplicated measurements removed (VegVault-Trait_data issue
            13); coordinates outside -180 to 180 and -90 to 90 set to
            missing (G2 decision 4)."
        - metrics: [datasets, samples, positions]
          scopes: ["traits / BIEN"]
          reason: "BIEN trait samples without a value are dropped; v1.0.0
            has 238,777 (G2 decision 4)."
        - metrics: [sample_taxa_rows]
          scopes: ["vegetation_plot / BIEN"]
          reason: "One record per taxon in each plot: repeated listings
            of the same taxon are merged and only the latest survey of a
            plot is kept, so 524,439 records against 972,791 in v1.0.0
            (VegVault-Vegetation_data pull request 26)."
        - metrics: [datasets, samples, positions, sample_taxa_rows]
          scopes: ["fossil_pollen_archive / FOSSILPOL"]
          reason: "FOSSILPOL rerun with a fresh Neotoma download: 1,551
            records against 1,393 in v1.0.0 (VegVault-FOSSILPOL issue
            16)."
        - metrics: [abiotic_values]
          scopes: [HWSD2]
          reason: "HWSD v2.2 soil groups; cells without a soil group get
            no row (contract hwsd_soil 2.0.0, VegVault issue 93)."
        - metrics: [abiotic_values]
          scopes: [bio12, bio18]
          reason: "The inflated CHELSA-TraCE21k block of the southern
            Amazon is masked (VegVault issue 93)."
  # Flat-file export
  export:
    # Replace flat files that already exist
    #   (R/02_Main_analyses/12_Export_db_flat.R)
    rewrite: false
    # Folder of the CSV files, relative to the project root (git-ignored)
    output_dir: "Outputs/Data/VegVault/Flat_files"
  # Manuscript figures, from the scripts in R/03_Visualisation/01_manuscript/.
  #   In the `subset` profile every example region is replaced by the
  #   subset box.
  figures:
    # Folder of the figure files, relative to the project root
    output_dir: "Outputs/Figures/mns"
    # Sample ages of one fossil pollen dataset with the range of their age
    #   iterations (age_uncertainty.R)
    sample_age:
      # Dataset name, `fossilpol_<Neotoma dataset ID>`. v1 showed the
      #   dataset with database ID 91256, but IDs change with every build.
      #   Not chosen yet: this figure stops (the others are drawn) until a
      #   name is set here.
      dataset_name: null
    # Gridpoints and their links to vegetation plots in one country
    #   (gridpoint_resolution.R)
    gridpoint_example:
      # GADM code of the country outlined on the maps
      country_code: "CZE"
      abiotic_variable_name: "bio1"
      region:
        lon_min: 12
        lon_max: 18.9
        lat_min: 48.5
        lat_max: 51.1
      # Extent of the overview map
      overview:
        lon_min: -10
        lon_max: 32
        lat_min: 35
        lat_max: 60
    # vaultkeepr example: occurrences of one genus in vegetation plots and
    #   fossil pollen records (vaultkeepr_examples.r)
    taxon_example:
      taxon_name: "Picea"
      age_min: 0
      age_max: 12000
      # Width of the age bins of the fossil records, in years
      age_bin_width: 2500
      region:
        lon_min: -135
        lon_max: -60
        lat_min: 22
        lat_max: 60
    # vaultkeepr example: vegetation plots with the climate of their
    #   gridpoint (vaultkeepr_examples.r)
    climate_example:
      abiotic_variable_name: "bio1"
      # Legend title of the variable; its unit is added from the database
      abiotic_variable_label: "MAT"
      region:
        lon_min: 12
        lon_max: 18.9
        lat_min: 48.5
        lat_max: 51.1
    # vaultkeepr example: fossil pollen records with trait values of their
    #   genera (vaultkeepr_examples.r)
    trait_example:
      # Trait domain name as stored in the database (with its v1 spelling)
      trait_domain_name: "Plant heigh"
      # Axis title of the averaged trait values
      value_label: "Average Plant Height\nper genera"
      age_min: 6000
      age_max: 12000
      region:
        lon_min: -110
        lon_max: -38
        lat_min: -53
        lat_max: 28
    # File name, width (a name in `graphical: manuscript: image_width`)
    #   and height (in `graphical: manuscript: image_units`) of each figure;
    #   the file names are those of v1
    files:
      sample_age:
        file_name: "fig_sample_age.pdf"
        width: "double"
        height: 130
      datasets:
        file_name: "fig_datasets.pdf"
        width: "full"
        height: 120
      gridpoint_example:
        file_name: "fig_gridpoints_example.pdf"
        width: "full"
        height: 120
      plot_size:
        file_name: "fig_samples_plot_size.pdf"
        width: "single"
        height: 60
      taxa_classification:
        file_name: "fig_n_taxa_per_class.pdf"
        width: "double"
        height: 120
      sample_coverage:
        file_name: "fig_vegetation.pdf"
        width: "full"
        height: 90
      taxon_example:
        file_name: "fig_na_picea.pdf"
        width: "full"
        height: 140
      climate_example:
        file_name: "fig_cz_jsdm.pdf"
        width: "double"
        height: 120
      trait_example:
        file_name: "fig_la_traits.pdf"
        width: "full"
        height: 120
      vaultkeepr_examples:
        file_name: "fig_vaultkeepr_examples.pdf"
        width: "full"
        height: 220

  #--------------------------------------------------#
  # Sections of the database-core stages: gridpoint links and database
  #   assembly
  #--------------------------------------------------#

  # Gridpoint links between samples and climate gridpoints (stage
  #   02_Gridpoints). A sample position and a gridpoint are linked when
  #   they are at most `distance_km` apart (geodesic on WGS84) and at most
  #   `distance_years` apart in age, the rule of v1.0.0.
  link:
    distance_km: 50
    distance_years: 5000
    # Decimals of the gridpoint coordinates, as in v1.0.0
    coordinate_digits: 2
    # Search windows before the exact distance test. A radius no larger
    #   than the smallest radius of curvature of WGS84 (6335.44 km) makes
    #   the windows hold every point within `distance_km`; the margin, in
    #   degrees, widens them further.
    radius_min_km: 6335.4
    window_margin_deg: 0.01
    # Years added to `distance_years` in the age join; the exact age test
    #   then decides
    age_margin_years: 1
    # Positions per branch of the link computation
    chunk_size: 5000

  # Database assembly (stage 03_Database_assembly): one bulk load into a
  #   work file next to the database, finished with ANALYZE and VACUUM
  #   INTO (save_vegvault_database()), with the settings measured in
  #   Documentation/Database_design_2.0.0.md, section 6.
  build:
    # Rows written per transaction
    chunk_size: 100000
    # Connection settings while the rows are loaded. The journal is kept in
    #   memory, not switched off, so that a failed batch can roll back;
    #   foreign keys are checked once by the validation stage.
    #   cache_size is in KiB when negative (1 GiB).
    pragmas_load:
      journal_mode: "MEMORY"
      synchronous: "OFF"
      foreign_keys: "OFF"
      cache_size: -1048576
    # Safe settings restored and checked before VACUUM INTO
    pragmas_final:
      journal_mode: "DELETE"
      synchronous: "FULL"
      foreign_keys: "ON"
    # Taxon classification as in v1.0.0 (classify_taxa()): names matched
    #   by the Global Names Verifier ("gnr") and classified in the GBIF
    #   Backbone Taxonomy ("gbif") with {taxospace}
    classification:
      # Batches of names, each cached by {targets}; a new number
      #   classifies every name again
      n_batches: 1024
      # Classified with every batch; a batch in which it gets no family
      #   stops, so that no result of a service failure is kept
      check_taxon: "Quercus robur"
      db_name: "gnr"
      db_class: "gbif"
    # Fixed values and references of each source, with the texts of
    #   v1.0.0. A reference has a role: the source type, or every data
    #   source, sampling method, taxon or trait of the source. References
    #   taken from the producer data are not mandatory. The order of the
    #   sources gives the order of their ids.
    sources:
      splot:
        dataset_type: "vegetation_plot"
        dataset_source_type: "sPlotOpen"
        sample_size_description: "square meters"
        references:
          - role: "source_type"
            mandatory: true
            detail: "Sabatini FM, Lenoir J, Hattab T, et al. sPlotOpen – An environmentally balanced, open-access, global dataset of vegetation plots. Global Ecol Biogeogr. 2021; 30: 1740–1764. https://doi.org/10.1111/geb.13346"
          - role: "taxon"
            mandatory: false
            detail: "sPlotOpen"
      bien_plots:
        dataset_type: "vegetation_plot"
        dataset_source_type: "BIEN"
        sample_size_description: "square meters"
        references:
          - role: "source_type"
            mandatory: true
            detail: "Enquist, B J, B Sandel, B Boyle, J-C Svenning, B J McGill, J C Donoghue, C E Hinchliff, et al. ‘Botanical Big Data Shows That Plant Diversity in the New World Is Driven by Climatic-Linked Differences in Evolutionary Rates and Biotic Exclusion’, n.d."
          - role: "source_type"
            mandatory: true
            detail: "S, Maitner Brian, Boyle Brad, Casler Nathan, Condit Rick, Donoghue John, Duran Sandra M, Guaderrama Daniel, et al. ‘The Bien r Package: A Tool to Access the Botanical Information and Ecology Network (BIEN) Database’. Methods in Ecology and Evolution 9, no. 2 (n.d.): 373–79. https://doi.org/10.1111/2041-210X.12861."
          - role: "sampling_method"
            mandatory: false
            detail: "BIEN"
          - role: "taxon"
            mandatory: false
            detail: "BIEN"
      fossilpol:
        dataset_type: "fossil_pollen_archive"
        dataset_source_type: "FOSSILPOL"
        references:
          - role: "source_type"
            mandatory: true
            detail: "Flantua, S. G. A., Mottl, O., Felde, V. A., Bhatta, K. P., Birks, H. H., Grytnes, J.-A., Seddon, A. W. R., & Birks, H. J. B. (2023). A guide to the processing and standardization of global palaeoecological data for large-scale syntheses using fossil pollen. Global Ecology and Biogeography, 32, 1377–1394. https://doi.org/10.1111/geb.13693"
          - role: "data_source"
            mandatory: true
            detail: "Grimm, E.C., 2008. Neotoma: an ecosystem database for the Pliocene, Pleistocene, and Holocene. Illinois State Museum Scientific Papers E Series, 1."
          - role: "sampling_method"
            mandatory: false
            detail: "Neotoma"
          - role: "taxon"
            mandatory: false
            detail: "Neotoma"
      try:
        dataset_type: "traits"
        dataset_source_type: "TRY"
        references:
          - role: "source_type"
            mandatory: true
            detail: "Kattge J, Bönisch G, Díaz S, et al. TRY plant trait database – enhanced coverage and open access. Glob Change Biol. 2020; 26: 119–188. https://doi.org/10.1111/gcb.14904"
          - role: "taxon"
            mandatory: false
            detail: "TRY"
          - role: "trait"
            mandatory: false
            detail: "TRY"
      bien_traits:
        dataset_type: "traits"
        dataset_source_type: "BIEN"
        references:
          - role: "source_type"
            mandatory: true
            detail: "Enquist, B J, B Sandel, B Boyle, J-C Svenning, B J McGill, J C Donoghue, C E Hinchliff, et al. ‘Botanical Big Data Shows That Plant Diversity in the New World Is Driven by Climatic-Linked Differences in Evolutionary Rates and Biotic Exclusion’, n.d."
          - role: "source_type"
            mandatory: true
            detail: "S, Maitner Brian, Boyle Brad, Casler Nathan, Condit Rick, Donoghue John, Duran Sandra M, Guaderrama Daniel, et al. ‘The Bien r Package: A Tool to Access the Botanical Information and Ecology Network (BIEN) Database’. Methods in Ecology and Evolution 9, no. 2 (n.d.): 373–79. https://doi.org/10.1111/2041-210X.12861."
          - role: "taxon"
            mandatory: false
            detail: "BIEN"
          - role: "trait"
            mandatory: false
            detail: "BIEN"
      # Gridpoints: one dataset per grid cell, one sample per cell and age
      gridpoints:
        dataset_type: "gridpoints"
        dataset_source_type: "gridpoints"
        data_source_desc: "gridpoints"
        references:
          - role: "source_type"
            mandatory: true
            detail: "gridpoints - artificially created by O. Mottl"
          - role: "data_source"
            mandatory: true
            detail: "gridpoints - artificially created by O. Mottl"
          - role: "dataset"
            mandatory: true
            detail: "gridpoints - artificially created by O. Mottl"
          - role: "sample"
            mandatory: true
            detail: "gridpoints - artificially created by O. Mottl"
      # Abiotic artefacts: the references of every variable they give.
      #   The unit and details of a climate variable come from the
      #   `variables` table of its producer contract.
      chelsa_neoclimate:
        references:
          - role: "abiotic_variable"
            mandatory: true
            detail: "Karger, Dirk Nikolaus, Olaf Conrad, Jürgen Böhner, Tobias Kawohl, Holger Kreft, Rodrigo Wilber Soria-Auza, Niklaus E. Zimmermann, H. Peter Linder, and Michael Kessler. Climatologies at high resolution for the earth’s land surface areas. Scientific data 4, no. 1 (2017): 1-20. https://doi.org/10.1038/sdata.2017.122"
          - role: "abiotic_variable"
            mandatory: true
            detail: "Karger D.N., Conrad, O., Böhner, J., Kawohl, T., Kreft, H., Soria-Auza, R.W., Zimmermann, N.E, Linder, H.P., Kessler, M. (2018): Data from: Climatologies at high resolution for the earth’s land surface areas. EnviDat. https://doi.org/10.16904/envidat.228.v2.1"
      chelsa_trace21k_palaeoclimate:
        references:
          - role: "abiotic_variable"
            mandatory: true
            detail: "Karger, D. N., M. P. Nobis, S. Normand, C. H. Graham, and N. E. Zimmermann. 'CHELSA-TraCE21k: downscaled transient temperature and precipitation data since the last glacial maximum. EnviDat. 2020. https://www.doi.org/10.16904/envidat.211"
          - role: "abiotic_variable"
            mandatory: true
            detail: "Karger, Dirk Nikolaus, Michael P. Nobis, Signe Normand, Catherine H. Graham, and Niklaus E. Zimmermann. 'CHELSA-TraCE21k–high-resolution (1 km) downscaled transient temperature and precipitation data since the Last Glacial Maximum. Climate of the Past 19, no. 2 (2023): 439-456. https://doi.org/10.5194/cp-19-439-2023"
      # The soil contract has no variables table: the label is the one
      #   its value column documents. The references are the HWSD 2.2
      #   database and the HWSD 2.0 methodology, chosen by Ondrej (the
      #   v1.0.0 texts cite WoSIS, which was not the source).
      hwsd_soil:
        variable:
          name: "HWSD2"
          unit: "Unitless"
          details: "HWSD-soil_group"
        references:
          - role: "abiotic_variable"
            mandatory: true
            detail: "FAO & IIASA. Harmonized World Soil Database version 2.2. https://data.apps.fao.org/catalog/iso/ff5c613c-75bb-46a9-a162-bc728059b465. Licence: CC BY 4.0"
          - role: "abiotic_variable"
            mandatory: true
            detail: "FAO & IIASA. 2023. Harmonized World Soil Database version 2.0. Rome and Laxenburg. https://doi.org/10.4060/cc3823en"
      # Taxon classification: the v1.0.0 reference of every species,
      #   genus and family name it gives. It comes last, as in v1.0.0, so
      #   its names and its reference get the last ids.
      taxospace:
        references:
          - role: "taxon"
            mandatory: false
            detail: "taxospace"
    # References of the database itself, linked to nothing; the first
    #   gets id 1
    general:
      references:
        - role: "general"
          mandatory: true
          detail: "VegVault: an interdisciplinary database linking paleo-, and neo-vegetation data with functional traits and abiotic drivers"
    # Authors of the database, in the order of their ids
    authors:
      - fullname: "Ondřej Mottl"
        email: "ondrej.mottl@gmail.com"
        orcid: "0000-0002-9796-5081"


#----------------------------------------------------------#
# Regional rehearsal build -----
#----------------------------------------------------------#

# Builds a small disposable database from the records inside one box, to
#   rehearse and profile the build. The box holds records of every source
#   type and land north of 63.3 degrees, where the v1 +-1 degree longitude
#   window of the gridpoint links is narrower than 50 km. Box and margins are
#   those of the database research settings, which counted the v1 content of
#   candidate boxes.
subset:
  profile: "subset"
  subset:
    enabled: true
    box_name: "alaska_yukon"
    lon_min: -170
    lon_max: -125
    lat_min: 54
    lat_max: 72
    # Margin for gridpoint cells around the box, in degrees. 50 km is about
    #   0.45 degrees of latitude everywhere and 1.45 degrees of longitude at
    #   72 degrees north.
    margin_lat: 0.5
    margin_lon: 1.5
    # Disposable database, relative to the data root
    database_file: "Temp/Subset/VegVault_subset_alaska_yukon.sqlite"
  # A rehearsal export never overwrites the export of a full build
  export:
    output_dir: "Data/Temp/Subset/Flat_files"
  # Nor do rehearsal validation reports mix with those of full builds
  validation:
    output_dir: "Data/Temp/Subset/Validation"
  # Nor do rehearsal figures replace the figures of a full build
  figures:
    output_dir: "Data/Temp/Subset/Figures"


#----------------------------------------------------------#
# Release build -----
#----------------------------------------------------------#

# The published build. It refuses to run with the subset enabled
#   (validate_build_profile()) and reads only tagged, checksum-verified
#   producer artefacts.
release:
  profile: "release"
  producers:
    mode: "release"
