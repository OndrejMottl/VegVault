# Project configuration read through `load_config_value()`.
# Select a profile with the `R_CONFIG_ACTIVE` environment variable; the
#   `default` profile is used otherwise. Other profiles inherit from
#   `default` and only list the values they change.
# Machine-local paths, including the live and v1 database paths, do not
#   belong here; put them in the git-ignored `secrets.yaml` (see
#   `secrets_example.yaml`). The one exception is the disposable database of
#   the `subset` profile, a path relative to the data root.
# Profiles: `default` (full build during development), `subset` (regional
#   rehearsal build) and `release` (the published build).
# Each pipeline stage has an owner (see .ai/analysis-structure.md); add or
#   change only the sections of the stages you own.

default:
  # Name of the active profile, recorded in the build manifest
  profile: "default"
  seed: 900723
  # Data root used when `secrets.yaml` has no `Data` entry; relative to the
  #   project. Target stores go to `<data root>/Targets_data/`.
  data_storage_path: "Data"
  # Packages for renv to record. Packages called only as `pkg::fun()` are
  #   detected automatically.
  packages:
    # Attached by `R/___setup_project___.R`. The legacy database writers
    #   call `%>%` and some functions without a namespace, so the packages
    #   R/00_Config_file.R attached for them stay attached. Do not attach
    #   packages that mask base functions (e.g. renv, config).
    attach:
      - assertthat
      - cli
      - DBI
      - here
      - RSQLite
      - targets
      - tidyverse
    # Installed and recorded, but not attached (IDE and workflow tools)
    tools:
      - janitor
      - jsonlite
      - knitr
      - languageserver
      - remotes
      - rlang
      - roxygen2
      - tinytable
      - usethis
  # Figure defaults of the template, used by the project setup
  graphical:
    width: 16
    height: 12
    units: "cm"
    dpi: 300
    bg: "white"
    text_size: 10
    line_size: 0.1
    # Manuscript figures, from R/03_Visualisation/01_manuscript/
    #   00_Config_mns.R. Palette colours stay in `colors.json`; the three
    #   colours below are the ones that script sets directly.
    manuscript:
      text_size: 14
      line_size: 0.1
      point_size: 3
      # Text width, in characters, at which labels are wrapped
      text_wrap_width: 60
      image_units: "mm"
      image_width:
        single: 89
        double: 183
        full: 247
      colors:
        brown_neutral: "#5F634F"
        grey: "#999999"
        red: "red"
    # Website figures, from R/03_Visualisation/00_Config_quarto.R. Colours
    #   and the font stay in `colors.json` and `fonts.json`.
    website:
      text_size: 32
      line_size: 0.1
      point_size: 3
      image_units: "px"
      image_width: 2450
      image_height: 1200
  # Database version record; the last entry is the version being built.
  #   Copied from R/00_Config_file.R, which keeps its own copy for the
  #   website and the legacy scripts until they read this file.
  database:
    versions:
      - version: "0.0.2"
        update_date: "2024-10-17"
        changelog: "Beging the versioning of the database"
      - version: "0.0.3"
        update_date: "2024-11-18"
        changelog: "Reworked the `References` and flagged `mandatory`"
      - version: "0.0.4"
        update_date: "2024-12-19"
        changelog: >-
          Update the version control and correct the Dataset References
      - version: "1.0.0"
        update_date: "2025-01-20"
        changelog: "First release of the database"
      - version: "2.0.0"
        update_date: "2026-08-28"
        changelog: >-
          Development schema for audited trait units and transformation
          provenance; not a published database release

  #--------------------------------------------------#
  # Sections of the VegVault pipeline stages: producer import, validation,
  #   export and figures. Empty until those stages are built.
  #--------------------------------------------------#

  # Pinned producer artefacts and their profiles
  producers: {}
  # Regional rehearsal build; enabled only in the `subset` profile below
  subset:
    enabled: false
  # Release checks of the built database
  validation:
    # Print every check result, not only failures
    #   (R/02_Main_analyses/11_Check_database.R)
    verbose: false
  # Flat-file export
  export:
    # Replace flat files that already exist
    #   (R/02_Main_analyses/12_Export_db_flat.R)
    rewrite: false

  #--------------------------------------------------#
  # Sections of the database-core stages: gridpoint links and database
  #   assembly. Empty until those stages are built.
  #--------------------------------------------------#

  # Gridpoint links between samples and climate gridpoints
  link: {}
  # Database assembly
  build: {}


#----------------------------------------------------------#
# Regional rehearsal build -----
#----------------------------------------------------------#

# Builds a small disposable database from the records inside one box, to
#   rehearse and profile the build. The box holds records of every source
#   type and land north of 63.3 degrees, where the v1 +-1 degree longitude
#   window of the gridpoint links is narrower than 50 km. Box and margins are
#   those of the database research settings, which counted the v1 content of
#   candidate boxes.
subset:
  profile: "subset"
  subset:
    enabled: true
    box_name: "alaska_yukon"
    lon_min: -170
    lon_max: -125
    lat_min: 54
    lat_max: 72
    # Margin for gridpoint cells around the box, in degrees. 50 km is about
    #   0.45 degrees of latitude everywhere and 1.45 degrees of longitude at
    #   72 degrees north.
    margin_lat: 0.5
    margin_lon: 1.5
    # Disposable database, relative to the data root
    database_file: "Temp/Subset/VegVault_subset_alaska_yukon.sqlite"


#----------------------------------------------------------#
# Release build -----
#----------------------------------------------------------#

# The published build. It refuses to run with the subset enabled
#   (validate_build_profile()).
release:
  profile: "release"
