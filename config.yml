# Project configuration read through `load_config_value()`.
# Select a profile with the `R_CONFIG_ACTIVE` environment variable; the
#   `default` profile is used otherwise. Other profiles inherit from
#   `default` and only list the values they change.
# Machine-local paths, including the live and v1 database paths, do not
#   belong here; put them in the git-ignored `secrets.yaml` (see
#   `secrets_example.yaml`). The one exception is the disposable database of
#   the `subset` profile, a path relative to the data root.
# Profiles: `default` (full build during development), `subset` (regional
#   rehearsal build) and `release` (the published build).
# Each pipeline stage has an owner (see .ai/analysis-structure.md); add or
#   change only the sections of the stages you own.

default:
  # Name of the active profile, recorded in the build manifest
  profile: "default"
  seed: 900723
  # Data root used when `secrets.yaml` has no `Data` entry; relative to the
  #   project. Target stores go to `<data root>/Targets_data/`.
  data_storage_path: "Data"
  # Packages for renv to record. Packages called only as `pkg::fun()` are
  #   detected automatically.
  packages:
    # Attached by `R/___setup_project___.R`. The legacy database writers
    #   call `%>%` and some functions without a namespace, so the packages
    #   R/00_Config_file.R attached for them stay attached. Do not attach
    #   packages that mask base functions (e.g. renv, config).
    attach:
      - assertthat
      - cli
      - DBI
      - here
      - RSQLite
      - targets
      - tidyverse
    # Installed and recorded, but not attached (IDE and workflow tools, and
    #   packages used only through others, such as `maps` for the country
    #   outlines of ggplot2::map_data())
    tools:
      - janitor
      - jsonlite
      - knitr
      - languageserver
      - maps
      - remotes
      - rlang
      - roxygen2
      - tinytable
      - usethis
  # Figure defaults of the template, used by the project setup
  graphical:
    width: 16
    height: 12
    units: "cm"
    dpi: 300
    bg: "white"
    text_size: 10
    line_size: 0.1
    # Manuscript figures, from R/03_Visualisation/01_manuscript/
    #   00_Config_mns.R. Palette colours stay in `colors.json`; the three
    #   colours below are the ones that script sets directly.
    manuscript:
      text_size: 14
      line_size: 0.1
      point_size: 3
      # Text width, in characters, at which labels are wrapped
      text_wrap_width: 60
      image_units: "mm"
      image_width:
        single: 89
        double: 183
        full: 247
      colors:
        brown_neutral: "#5F634F"
        grey: "#999999"
        red: "red"
    # Website figures, from R/03_Visualisation/00_Config_quarto.R. Colours
    #   and the font stay in `colors.json` and `fonts.json`.
    website:
      text_size: 32
      line_size: 0.1
      point_size: 3
      image_units: "px"
      image_width: 2450
      image_height: 1200
  # Database version record; the last entry is the version being built.
  #   Copied from R/00_Config_file.R, which keeps its own copy for the
  #   website and the legacy scripts until they read this file.
  database:
    versions:
      - version: "0.0.2"
        update_date: "2024-10-17"
        changelog: "Beging the versioning of the database"
      - version: "0.0.3"
        update_date: "2024-11-18"
        changelog: "Reworked the `References` and flagged `mandatory`"
      - version: "0.0.4"
        update_date: "2024-12-19"
        changelog: >-
          Update the version control and correct the Dataset References
      - version: "1.0.0"
        update_date: "2025-01-20"
        changelog: "First release of the database"
      - version: "2.0.0"
        update_date: "2026-08-28"
        changelog: >-
          Development schema for audited trait units and transformation
          provenance; not a published database release

  #--------------------------------------------------#
  # Sections of the VegVault pipeline stages: producer import, validation,
  #   export and figures. `graphical: manuscript` above holds the figure
  #   sizes and colours.
  #--------------------------------------------------#

  # Pinned producer artefacts and their profiles
  producers: {}
  # Regional rehearsal build; enabled only in the `subset` profile below
  subset:
    enabled: false
  # Release checks of the built database
  validation:
    # Print every check result, not only failures
    #   (R/02_Main_analyses/11_Check_database.R)
    verbose: false
  # Flat-file export
  export:
    # Replace flat files that already exist
    #   (R/02_Main_analyses/12_Export_db_flat.R)
    rewrite: false
    # Folder of the CSV files, relative to the project root (git-ignored)
    output_dir: "Outputs/Data/VegVault/Flat_files"
  # Manuscript figures, from the scripts in R/03_Visualisation/01_manuscript/.
  #   In the `subset` profile every example region is replaced by the
  #   subset box.
  figures:
    # Folder of the figure files, relative to the project root
    output_dir: "Outputs/Figures/mns"
    # Sample ages of one fossil pollen dataset with the range of their age
    #   iterations (age_uncertainty.R)
    sample_age:
      # Dataset name, `fossilpol_<Neotoma dataset ID>`. v1 showed the
      #   dataset with database ID 91256, but IDs change with every build.
      #   Not chosen yet: this figure stops (the others are drawn) until a
      #   name is set here.
      dataset_name: null
    # Gridpoints and their links to vegetation plots in one country
    #   (gridpoint_resolution.R)
    gridpoint_example:
      # GADM code of the country outlined on the maps
      country_code: "CZE"
      abiotic_variable_name: "bio1"
      region:
        lon_min: 12
        lon_max: 18.9
        lat_min: 48.5
        lat_max: 51.1
      # Extent of the overview map
      overview:
        lon_min: -10
        lon_max: 32
        lat_min: 35
        lat_max: 60
    # vaultkeepr example: occurrences of one genus in vegetation plots and
    #   fossil pollen records (vaultkeepr_examples.r)
    taxon_example:
      taxon_name: "Picea"
      age_min: 0
      age_max: 12000
      # Width of the age bins of the fossil records, in years
      age_bin_width: 2500
      region:
        lon_min: -135
        lon_max: -60
        lat_min: 22
        lat_max: 60
    # vaultkeepr example: vegetation plots with the climate of their
    #   gridpoint (vaultkeepr_examples.r)
    climate_example:
      abiotic_variable_name: "bio1"
      # Legend title of the variable; its unit is added from the database
      abiotic_variable_label: "MAT"
      region:
        lon_min: 12
        lon_max: 18.9
        lat_min: 48.5
        lat_max: 51.1
    # vaultkeepr example: fossil pollen records with trait values of their
    #   genera (vaultkeepr_examples.r)
    trait_example:
      # Trait domain name as stored in the database (with its v1 spelling)
      trait_domain_name: "Plant heigh"
      # Axis title of the averaged trait values
      value_label: "Average Plant Height\nper genera"
      age_min: 6000
      age_max: 12000
      region:
        lon_min: -110
        lon_max: -38
        lat_min: -53
        lat_max: 28
    # File name, width (a name in `graphical: manuscript: image_width`)
    #   and height (in `graphical: manuscript: image_units`) of each figure;
    #   the file names are those of v1
    files:
      sample_age:
        file_name: "fig_sample_age.pdf"
        width: "double"
        height: 130
      datasets:
        file_name: "fig_datasets.pdf"
        width: "full"
        height: 120
      gridpoint_example:
        file_name: "fig_gridpoints_example.pdf"
        width: "full"
        height: 120
      plot_size:
        file_name: "fig_samples_plot_size.pdf"
        width: "single"
        height: 60
      taxa_classification:
        file_name: "fig_n_taxa_per_class.pdf"
        width: "double"
        height: 120
      sample_coverage:
        file_name: "fig_vegetation.pdf"
        width: "full"
        height: 90
      taxon_example:
        file_name: "fig_na_picea.pdf"
        width: "full"
        height: 140
      climate_example:
        file_name: "fig_cz_jsdm.pdf"
        width: "double"
        height: 120
      trait_example:
        file_name: "fig_la_traits.pdf"
        width: "full"
        height: 120
      vaultkeepr_examples:
        file_name: "fig_vaultkeepr_examples.pdf"
        width: "full"
        height: 220

  #--------------------------------------------------#
  # Sections of the database-core stages: gridpoint links and database
  #   assembly. Empty until those stages are built.
  #--------------------------------------------------#

  # Gridpoint links between samples and climate gridpoints
  link: {}
  # Database assembly
  build: {}


#----------------------------------------------------------#
# Regional rehearsal build -----
#----------------------------------------------------------#

# Builds a small disposable database from the records inside one box, to
#   rehearse and profile the build. The box holds records of every source
#   type and land north of 63.3 degrees, where the v1 +-1 degree longitude
#   window of the gridpoint links is narrower than 50 km. Box and margins are
#   those of the database research settings, which counted the v1 content of
#   candidate boxes.
subset:
  profile: "subset"
  subset:
    enabled: true
    box_name: "alaska_yukon"
    lon_min: -170
    lon_max: -125
    lat_min: 54
    lat_max: 72
    # Margin for gridpoint cells around the box, in degrees. 50 km is about
    #   0.45 degrees of latitude everywhere and 1.45 degrees of longitude at
    #   72 degrees north.
    margin_lat: 0.5
    margin_lon: 1.5
    # Disposable database, relative to the data root
    database_file: "Temp/Subset/VegVault_subset_alaska_yukon.sqlite"
  # A rehearsal export never overwrites the export of a full build
  export:
    output_dir: "Data/Temp/Subset/Flat_files"
  # Nor do rehearsal figures replace the figures of a full build
  figures:
    output_dir: "Data/Temp/Subset/Figures"


#----------------------------------------------------------#
# Release build -----
#----------------------------------------------------------#

# The published build. It refuses to run with the subset enabled
#   (validate_build_profile()).
release:
  profile: "release"
